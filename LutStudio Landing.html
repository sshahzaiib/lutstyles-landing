document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"5ddb5269-c973-49b2-aae1-4f3f0e05c08d\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"056b0283-4762-486e-88bd-5543b4358336\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"2745c3b7-2006-48a8-92ed-48a2d8525735\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Newsreader';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"50b8bbfa-7661-4479-a9c1-3f5c4840ec67\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    --bg:        oklch(0.17 0.012 55);\n    --bg-2:      oklch(0.21 0.014 55);\n    --bg-3:      oklch(0.25 0.014 55);\n    --line:      oklch(0.32 0.012 55);\n    --line-2:    oklch(0.40 0.012 55);\n    --fg:        oklch(0.96 0.008 80);\n    --fg-mute:   oklch(0.74 0.012 70);\n    --fg-dim:    oklch(0.56 0.012 65);\n    --amber:     oklch(0.80 0.155 62);\n    --amber-2:   oklch(0.72 0.155 55);\n    --teal:      oklch(0.70 0.075 210);\n\n    --serif: \"Instrument Serif\", \"Times New Roman\", serif;\n    --sans:  \"Geist\", ui-sans-serif, system-ui, sans-serif;\n    --mono:  \"Geist Mono\", ui-monospace, \"SFMono-Regular\", monospace;\n  }\n  *{box-sizing:border-box; margin:0; padding:0;}\n  html,body{background:var(--bg); color:var(--fg); font-family:var(--sans); font-feature-settings:\"ss01\",\"cv11\"; -webkit-font-smoothing:antialiased;}\n  body{font-size:16px; line-height:1.5;}\n  a{color:inherit; text-decoration:none;}\n  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}\n  input,textarea{font:inherit; color:inherit;}\n  img,svg{display:block; max-width:100%;}\n  hr{border:0; border-top:1px solid var(--line);}\n\n  .wrap{max-width:1240px; margin:0 auto; padding:0 32px;}\n  .eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-dim);}\n\n  /* ───────── NAV ───────── */\n  nav.top{\n    position:sticky; top:0; z-index:50;\n    backdrop-filter:blur(12px);\n    background:color-mix(in oklch, var(--bg) 78%, transparent);\n    border-bottom:1px solid var(--line);\n  }\n  nav.top .row{display:flex; align-items:center; justify-content:space-between; height:64px;}\n  .brand{display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:13px; letter-spacing:.02em;}\n  .brand .mark{\n    width:22px; height:22px; border-radius:4px;\n    background:\n      conic-gradient(from 220deg,\n        oklch(0.78 0.15 62) 0deg,\n        oklch(0.62 0.18 30) 70deg,\n        oklch(0.55 0.14 320) 150deg,\n        oklch(0.55 0.10 240) 230deg,\n        oklch(0.70 0.10 195) 300deg,\n        oklch(0.78 0.15 62) 360deg);\n    box-shadow: inset 0 0 0 1px oklch(0.10 0 0 / 0.5);\n  }\n  .nav-links{display:flex; gap:28px; font-size:14px; color:var(--fg-mute);}\n  .nav-links a:hover{color:var(--fg);}\n  .nav-cta{\n    display:inline-flex; align-items:center; gap:8px;\n    height:34px; padding:0 14px; border-radius:999px;\n    background:var(--fg); color:var(--bg);\n    font-size:13px; font-weight:500;\n  }\n  .nav-cta:hover{background:var(--amber); color:#1a1410;}\n\n  /* ───────── HERO ───────── */\n  .hero{padding:88px 0 56px;}\n  .hero-grid{display:grid; grid-template-columns: 1.05fr 1fr; gap:64px; align-items:center;}\n  @media (max-width:980px){ .hero-grid{grid-template-columns:1fr; gap:40px;} }\n\n  .badge{\n    display:inline-flex; align-items:center; gap:10px;\n    height:28px; padding:0 12px 0 10px; border-radius:999px;\n    border:1px solid var(--line-2); background:var(--bg-2);\n    font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--fg-mute);\n  }\n  .badge .dot{width:6px; height:6px; border-radius:50%; background:var(--amber); box-shadow:0 0 0 3px color-mix(in oklch, var(--amber) 25%, transparent);}\n\n  h1.display{\n    margin-top:22px;\n    font-family:var(--serif); font-weight:400;\n    font-size:clamp(48px, 6.4vw, 84px);\n    line-height:0.98; letter-spacing:-0.02em;\n    text-wrap:balance;\n  }\n  h1.display em{font-style:italic; color:var(--amber);}\n  .lede{\n    margin-top:22px; max-width:540px;\n    font-size:18px; line-height:1.55; color:var(--fg-mute); text-wrap:pretty;\n  }\n\n  /* Waitlist form */\n  .waitlist{\n    margin-top:32px; max-width:520px;\n  }\n  .waitlist .field{\n    display:flex; align-items:center; gap:8px;\n    background:var(--bg-2); border:1px solid var(--line-2);\n    border-radius:12px; padding:6px 6px 6px 16px;\n    transition:border-color .15s;\n  }\n  .waitlist .field:focus-within{border-color:var(--amber);}\n  .waitlist input{\n    flex:1; background:transparent; border:0; outline:0;\n    height:42px; font-size:15px;\n  }\n  .waitlist input::placeholder{color:var(--fg-dim);}\n  .waitlist .submit{\n    height:42px; padding:0 18px; border-radius:8px;\n    background:var(--amber); color:#1a1410;\n    font-weight:600; font-size:14px;\n    display:inline-flex; align-items:center; gap:6px;\n  }\n  .waitlist .submit:hover{background:var(--amber-2);}\n  .waitlist .micro{\n    margin-top:10px; font-size:12.5px; color:var(--fg-dim);\n    display:flex; align-items:center; gap:14px; flex-wrap:wrap;\n  }\n  .waitlist .micro .ok{color:var(--fg-mute);}\n  .ok-check{display:inline-block; width:12px; height:12px; vertical-align:-2px; margin-right:4px;}\n\n  .waitlist .done{\n    display:none; padding:14px 16px; border-radius:12px;\n    border:1px dashed var(--amber); background:color-mix(in oklch, var(--amber) 8%, var(--bg));\n    font-size:14px;\n  }\n  .waitlist.is-done .field, .waitlist.is-done .micro{display:none;}\n  .waitlist.is-done .done{display:block;}\n\n  /* ───────── VIEWER ───────── */\n  .viewer-card{\n    position:relative;\n    border:1px solid var(--line); border-radius:14px;\n    background:var(--bg-2);\n    padding:14px;\n    box-shadow: 0 30px 80px -40px oklch(0.05 0 0 / 0.8);\n  }\n  .viewer-bar{\n    display:flex; align-items:center; justify-content:space-between;\n    font-family:var(--mono); font-size:11px; color:var(--fg-dim);\n    padding:0 4px 12px;\n  }\n  .viewer-bar .chips{display:flex; gap:8px;}\n  .chip{\n    display:inline-flex; align-items:center; gap:6px;\n    height:22px; padding:0 8px; border-radius:6px;\n    background:var(--bg-3); border:1px solid var(--line);\n    color:var(--fg-mute);\n  }\n  .chip .sq{width:8px; height:8px; border-radius:2px;}\n\n  .viewer{\n    position:relative; aspect-ratio: 16/9;\n    border-radius:8px; overflow:hidden;\n    background:#000;\n    isolation:isolate;\n    user-select:none;\n  }\n  /* Painted \"footage\" using layered gradients — desert vista at golden hour */\n  .frame{\n    position:absolute; inset:0;\n  }\n  .frame .sky{\n    position:absolute; inset:0 0 38% 0;\n  }\n  .frame .land{\n    position:absolute; inset:62% 0 0 0;\n  }\n  .frame .sun{\n    position:absolute; left:62%; top:30%;\n    width:14%; aspect-ratio:1; border-radius:50%;\n    transform:translate(-50%,-50%);\n    filter:blur(0.5px);\n  }\n  .frame .ridge{\n    position:absolute; left:0; right:0; bottom:38%; height:18%;\n    clip-path: polygon(0% 100%, 7% 70%, 14% 88%, 22% 55%, 32% 80%, 42% 40%, 54% 75%, 64% 50%, 75% 82%, 86% 60%, 100% 92%, 100% 100%);\n  }\n  .frame .grain{\n    position:absolute; inset:0; mix-blend-mode:overlay; opacity:.18;\n    background-image: radial-gradient(rgba(255,255,255,.5) .5px, transparent .6px);\n    background-size: 3px 3px;\n  }\n\n  /* FLAT / LOG look */\n  .flat .sky   { background: linear-gradient(180deg, oklch(0.62 0.012 230), oklch(0.55 0.010 110)); }\n  .flat .land  { background: linear-gradient(180deg, oklch(0.46 0.012 90), oklch(0.40 0.010 80)); }\n  .flat .ridge { background: oklch(0.42 0.010 60); }\n  .flat .sun   { background: radial-gradient(circle, oklch(0.72 0.020 90) 0%, oklch(0.60 0.014 90) 60%, transparent 75%); }\n\n  /* GRADED look */\n  .graded .sky   { background: linear-gradient(180deg, oklch(0.80 0.13 65) 0%, oklch(0.62 0.16 35) 55%, oklch(0.40 0.10 25) 100%); }\n  .graded .land  { background: linear-gradient(180deg, oklch(0.28 0.04 240), oklch(0.18 0.03 250)); }\n  .graded .ridge { background: linear-gradient(180deg, oklch(0.34 0.05 30), oklch(0.22 0.04 30)); }\n  .graded .sun   { background: radial-gradient(circle, oklch(0.95 0.10 85) 0%, oklch(0.82 0.16 60) 50%, transparent 78%); box-shadow:0 0 60px 10px oklch(0.78 0.16 55 / .55);}\n\n  .layer{position:absolute; inset:0;}\n  .layer.after{ clip-path: inset(0 0 0 var(--split, 50%)); }\n\n  .splitter{\n    position:absolute; top:0; bottom:0;\n    left:var(--split, 50%); width:0;\n    z-index:5; pointer-events:auto;\n  }\n  .splitter .line{\n    position:absolute; top:0; bottom:0; left:-1px; width:2px;\n    background:var(--fg);\n    box-shadow: 0 0 0 1px oklch(0 0 0 / .35);\n  }\n  .splitter .knob{\n    position:absolute; top:50%; left:50%;\n    width:36px; height:36px; border-radius:50%;\n    transform:translate(-50%,-50%);\n    background:var(--fg); color:#1a1410;\n    display:flex; align-items:center; justify-content:center;\n    box-shadow: 0 6px 18px oklch(0 0 0 / .45);\n    cursor:ew-resize;\n  }\n  .splitter .knob svg{width:14px; height:14px;}\n\n  .corner-label{\n    position:absolute; bottom:10px;\n    font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase;\n    padding:4px 8px; border-radius:4px;\n    background:oklch(0 0 0 / .55); backdrop-filter:blur(4px);\n    color:var(--fg);\n    z-index:4;\n  }\n  .corner-label.l{left:12px;}\n  .corner-label.r{right:12px;}\n  .corner-label .d{display:inline-block; width:6px; height:6px; border-radius:2px; margin-right:6px; vertical-align:1px;}\n\n  .viewer-foot{\n    display:flex; align-items:center; justify-content:space-between;\n    margin-top:12px; padding:0 4px;\n    font-family:var(--mono); font-size:11px; color:var(--fg-dim);\n  }\n  .viewer-foot .scrub{flex:1; height:4px; background:var(--bg-3); border-radius:2px; margin:0 16px; position:relative;}\n  .viewer-foot .scrub::before{content:\"\"; position:absolute; left:0; top:0; bottom:0; width:36%; background:var(--amber); border-radius:2px;}\n\n  /* ───────── SECTIONS ───────── */\n  section{padding:96px 0;}\n  section + section{border-top:1px solid var(--line);}\n  .section-head{display:flex; align-items:end; justify-content:space-between; gap:40px; margin-bottom:48px;}\n  .section-head h2{\n    font-family:var(--serif); font-weight:400;\n    font-size:clamp(36px, 4.4vw, 56px); line-height:1.02; letter-spacing:-0.015em;\n    max-width:720px; text-wrap:balance;\n  }\n  .section-head h2 em{font-style:italic; color:var(--amber);}\n  .section-head .blurb{max-width:380px; color:var(--fg-mute); font-size:15px;}\n\n  /* Problem strip */\n  .pain{\n    display:grid; grid-template-columns: repeat(3, 1fr); gap:0;\n    border-top:1px solid var(--line); border-bottom:1px solid var(--line);\n  }\n  .pain .cell{\n    padding:36px 28px; border-left:1px solid var(--line);\n  }\n  .pain .cell:first-child{border-left:0;}\n  .pain .n{font-family:var(--mono); font-size:11px; color:var(--fg-dim);}\n  .pain h3{font-family:var(--serif); font-weight:400; font-size:26px; line-height:1.15; margin:14px 0 10px; letter-spacing:-0.01em;}\n  .pain p{color:var(--fg-mute); font-size:14.5px; line-height:1.55;}\n  @media (max-width:880px){ .pain{grid-template-columns:1fr;} .pain .cell{border-left:0; border-top:1px solid var(--line);} .pain .cell:first-child{border-top:0;} }\n\n  /* How it works */\n  .steps{display:grid; grid-template-columns: repeat(3, 1fr); gap:24px;}\n  @media (max-width:880px){ .steps{grid-template-columns:1fr;} }\n  .step{\n    border:1px solid var(--line); border-radius:14px; padding:24px;\n    background:var(--bg-2);\n    display:flex; flex-direction:column; gap:14px; min-height:280px;\n  }\n  .step .n{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.14em;}\n  .step h3{font-family:var(--serif); font-weight:400; font-size:24px; letter-spacing:-0.01em;}\n  .step p{color:var(--fg-mute); font-size:14.5px;}\n  .step .demo{margin-top:auto; height:120px; border-radius:8px; border:1px solid var(--line); background:var(--bg-3); position:relative; overflow:hidden;}\n\n  /* step demos */\n  .demo.drop{display:flex; align-items:center; justify-content:center;}\n  .demo.drop .dz{\n    border:1px dashed var(--line-2); border-radius:6px;\n    padding:16px 22px; font-family:var(--mono); font-size:11px; color:var(--fg-mute);\n    background:color-mix(in oklch, var(--amber) 6%, var(--bg-3));\n  }\n  .demo.list{padding:12px;}\n  .demo.list .row{\n    display:flex; align-items:center; justify-content:space-between;\n    font-family:var(--mono); font-size:11px; color:var(--fg-mute);\n    padding:6px 8px; border-radius:4px;\n  }\n  .demo.list .row + .row{border dow:0 4px 12px oklch(0 0 0 / .45);}\n  .viz.slider-viz .val{font-family:var(--mono); font-size:11px; color:var(--fg-mute);}\n\n  .viz.scopes{padding:10px; display:flex; gap:8px; align-items:flex-end;}\n  .viz.scopes .col{flex:1; display:flex; flex-direction:column; gap:2px;}\n  .viz.scopes .bar{height:3px; border-radius:1px;}\n\n  .viz.split{display:flex;}\n  .viz.split .a, .viz.split .b{flex:1; position:relative;}\n  .viz.split .a{background:linear-gradient(135deg, oklch(0.56 0.012 110), oklch(0.42 0.010 90));}\n  .viz.split .b{background:linear-gradient(135deg, oklch(0.78 0.14 55), oklch(0.32 0.04 30));}\n  .viz.split .div{width:2px; background:var(--fg);}\n\n  .viz.frame-viz{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:10px;}\n  .viz.frame-viz .f{border-radius:3px; aspect-ratio:16/9;}\n  .viz.frame-viz .f.sel{outline:2px solid var(--amber); outline-offset:2px;}\n\n  .viz.share{padding:14px; display:flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11px; color:var(--fg-mute);}\n  .viz.share .url{flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}\n  .viz.share .copy{padding:8px 10px; border-radius:6px; background:var(--fg); color:#1a1410;}\n\n  .viz.cube{display:flex; align-items:center; justify-content:center;}\n  .cubebox{\n    width:64px; height:64px; position:relative; transform-style:preserve-3d;\n    transform:rotateX(-22deg) rotateY(-30deg);\n  }\n  .cubebox span{\n    position:absolute; inset:0; border:1px solid var(--line-2);\n    background:linear-gradient(135deg, oklch(0.78 0.14 55), oklch(0.45 0.10 240));\n    opacity:.85;\n  }\n  .cubebox span:nth-child(1){transform:translateZ(32px);}\n  .cubebox span:nth-child(2){transform:rotateY(180deg) translateZ(32px); background:linear-gradient(135deg, oklch(0.65 0.12 200), oklch(0.30 0.06 30));}\n  .cubebox span:nth-child(3){transform:rotateY(90deg) translateZ(32px); background:linear-gradient(135deg, oklch(0.80 0.13 70), oklch(0.40 0.08 320));}\n  .cubebox span:nth-child(4){transform:rotateY(-90deg) translateZ(32px);}\n  .cubebox span:nth-child(5){transform:rotateX(90deg) translateZ(32px);}\n  .cubebox span:nth-child(6){transform:rotateX(-90deg) translateZ(32px);}\n\n  /* Audience cards */\n  .audience{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}\n  @media (max-width:880px){ .audience{grid-template-columns:1fr;} }\n  .aud{\n    border:1px solid var(--line); border-radius:14px; padding:28px;\n    background:linear-gradient(180deg, var(--bg-2), var(--bg));\n    display:flex; flex-direction:column; gap:14px;\n  }\n  .aud .role{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.14em; text-transform:uppercase;}\n  .aud h3{font-family:var(--serif); font-weight:400; font-size:26px; letter-spacing:-0.015em; line-height:1.15;}\n  .aud p{color:var(--fg-mute); font-size:14.5px;}\n  .aud ul{list-style:none; display:flex; flex-direction:column; gap:8px; margin-top:6px;}\n  .aud li{font-size:14px; color:var(--fg-mute); padding-left:18px; position:relative;}\n  .aud li::before{\n    content:\"\"; position:absolute; left:0; top:9px;\n    width:8px; height:1px; background:var(--amber);\n  }\n\n  /* FAQ */\n  .faq{display:grid; grid-template-columns: 1fr 1.6fr; gap:48px;}\n  @media (max-width:880px){ .faq{grid-template-columns:1fr;} }\n  .faq h2{font-family:var(--serif); font-weight:400; font-size:44px; line-height:1.05; letter-spacing:-0.015em;}\n  .faq h2 em{font-style:italic; color:var(--amber);}\n  details{border-top:1px solid var(--line); padding:20px 0;}\n  details:last-child{border-bottom:1px solid var(--line);}\n  details summary{\n    list-style:none; cursor:pointer;\n    display:flex; align-items:center; justify-content:space-between; gap:24px;\n    font-size:17px; letter-spacing:-0.005em;\n  }\n  details summary::-webkit-details-marker{display:none;}\n  details summary .plus{\n    width: \">\n  <div class=\"wrap row\">\n    <a class=\"brand\" href=\"#top\">\n      <span class=\"mark\"><\u002Fspan>\n      LutStudio<span style=\"color:var(--fg-dim)\">.com<\u002Fspan>\n    <\u002Fa>\n    <div class=\"nav-links\">\n      <a href=\"#how\">How it works<\u002Fa>\n      <a href=\"#features\">Features<\u002Fa>\n      <a href=\"#audience\">Who it's for<\u002Fa>\n      <a href=\"#faq\">FAQ<\u002Fa>\n    <\u002Fdiv>\n    <a class=\"nav-cta\" href=\"#waitlist\">Join the waitlist →<\u002Fa>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- HERO -->\n<header class=\"hero\" id=\"top\">\n  <div class=\"wrap hero-grid\">\n    <div>\n      <span class=\"badge\"><span class=\"dot\"><\u002Fspan> Private beta · opens Q3 2026<\u002Fspan>\n      <h1 class=\"display\">\n        Audition every&nbsp;LUT.<br>\n        <em>Render none.<\u002Fem>\n      <\u002Fh1>\n      <p class=\"lede\">\n        LutStudio is a browser tab for your <span style=\"font-family:var(--mono); color:var(--fg)\">.cube<\u002Fspan> collection. Drop in a clip, drop in a folder of LUTs, and arrow-key through your whole library on top of real footage — no NLE, no proxies, no render queue.\n      <\u002Fp>\n\n      <form class=\"waitlist\" id=\"waitlist-1\" novalidate=\"\">\n        <div class=\"field\">\n          <input type=\"email\" placeholder=\"your@email.com\" required=\"\" aria-label=\"Email\">\n          <button class=\"submit\" type=\"submit\">Get early access<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"micro\">\n          <span class=\"ok\">\n            <svg class=\"ok-check\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2 6.5L5 9L10 3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            Free during beta\n          <\u002Fspan>\n          <span class=\"ok\">\n            <svg class=\"ok-check\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2 6.5L5 9L10 3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            Footage stays on your machine\n          <\u002Fspan>\n          <span class=\"ok\">\n            <svg class=\"ok-check\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2 6.5L5 9L10 3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n            No card, no spam\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"done\">\n          Welcome in. We'll email you when your seat opens — usually inside a week. <br>\n          <span style=\"color:var(--fg-dim); font-size:12.5px; font-family:var(--mono); margin-top:6px; display:inline-block;\">queue position #<span id=\"qpos\">2,431<\u002Fspan><\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fform>\n    <\u002Fdiv>\n\n    <!-- VIEWER CARD -->\n    <div class=\"viewer-card\" aria-label=\"Before and after grade preview\">\n      <div class=\"viewer-bar\">\n        <div class=\"chips\">\n          <span class=\"chip\"><span class=\"sq\" style=\"background:oklch(0.55 0.012 110)\"><\u002Fspan> DJI_0432.MP4 · DLog-M<\u002Fspan>\n          <span class=\"chip\"><span class=\"sq\" style=\"background:linear-gradient(135deg, var(--amber), var(--teal))\"><\u002Fspan> /LUTs/Kodak_2383_v2.cube<\u002Fspan>\n        <\u002Fdiv>\n        <span>16:9 · 3840×2160<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"viewer\" id=\"viewer\">\n        <div class=\"layer\">\n          <div class=\"frame flat\">\n            <div class=\"sky\"><\u002Fdiv>\n            <div class=\"land\"><\u002Fdiv>\n            <div class=\"ridge\"><\u002Fdiv>\n            <div class=\"sun\"><\u002Fdiv>\n            <div class=\"grain\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"layer after\" id=\"afterLayer\">\n          <div class=\"frame graded\">\n            <div class=\"sky\"><\u002Fdiv>\n            <div class=\"land\"><\u002Fdiv>\n            <div class=\"ridge\"><\u002Fdiv>\n            <div class=\"sun\"><\u002Fdiv>\n            <div class=\"grain\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <span class=\"corner-label l\"><span class=\"d\" style=\"background:oklch(0.55 0.012 110)\"><\u002Fspan>LOG · D-Log M<\u002Fspan>\n        <span class=\"corner-label r\"><span class=\"d\" style=\"background:var(--amber)\"><\u002Fspan>GRADED · 2383<\u002Fspan>\n\n        <div class=\"splitter\" id=\"splitter\">\n          <div class=\"line\"><\u002Fdiv>\n          <div class=\"knob\" id=\"knob\" aria-label=\"Drag to compare\">\n            <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\">\n              <path d=\"M9 6 L5 12 L9 18\"><\u002Fpath>\n              <path d=\"M15 6 L19 12 L15 18\"><\u002Fpath>\n            <\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"viewer-foot\">\n        <span>00:00:14:08<\u002Fspan>\n        <div class=\"scrub\"><\u002Fdiv>\n        <span>00:00:39:22<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- LOGOS / TRUST STRIP -->\n<div class=\"wrap\" style=\"padding:24px 32px 8px;\">\n  <div class=\"row-inline\" style=\"justify-content:center; gap:14px; flex-wrap:wrap; color:var(--fg-dim); font-family:var(--mono); font-size:11px; letter-spacing:.08em;\">\n    <span>PLAYS NICE WITH<\u002Fspan>\n    <span class=\"pill\">DJI · D-Log M<\u002Fspan>\n    <span class=\"pill\">Sony · S-Log3 / HLG3<\u002Fspan>\n    <span class=\"pill\">Canon · C-Log 2/3<\u002Fspan>\n    <span class=\"pill\">Panasonic · V-Log<\u002Fspan>\n    <span class=\"pill\">BRAW · Gen 5<\u002Fspan>\n    <span class=\"pill\">Rec.709<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- PROBLEM -->\n<section id=\"problem\" style=\"padding-top:80px;\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <h2>Your LUT folder is a <em>graveyard<\u002Fem>.<\u002Fh2>\n      <p class=\"blurb\">You bought the pack. You downloaded the freebies. You saved the YouTuber's recipe. And then you never tried any of them — because trying meant importing.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"pain\">\n      <div class=\"cell\">\n        <div class=\"n\">01 — The import<\u002Fdiv>\n        <h3>Eight minutes to drag one clip into Resolve.<\u002Fh3>\n        <p>Every LUT test starts with a 4K transcode you didn't budget for. Optimized media. Cache. A spinning fan. By the time the first LUT loads, your coffee's cold.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"n\">02 — The render<\u002Fdiv>\n        <h3>Two minutes to export a 12-second look-test.<\u002Fh3>\n        <p>To show a client a single LUT, you wait through an H.264 export — then a WeTransfer upload, then a Slack reply. Multiply by four versions of the look.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"cell\">\n        <div class=\"n\">03 — The shrug<\u002Fdiv>\n        <h3>You ship the LUT you've used 40 times.<\u002Fh3>\n        <p>Not because it's the best one — because it's the one you didn't have to test. The \"/LUTs/to-try\" folder grows. The same three presets keep going out the door.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- HOW IT WORKS -->\n<section id=\"how\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <h2>Drop. Cycle. <em>Decide.<\u002Fem><\u002Fh2>\n      <p class=\"blurb\">Your clip never leaves your laptop. Every frame is rendered on your local GPU through a WebGL shader — the same math your NLE runs, just without the import-and-pray step.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"steps\">\n      <div class=\"step\">\n        <span class=\"n\">STEP 01<\u002Fspan>\n        <h3>Drop a clip.<\u002Fh3>\n        <p>Any MP4, MOV, or WebM straight from the SD card. No transcode, no proxy, no upload — the file stays on disk and streams into a local object URL.<\u002Fp>\n        <div class=\"demo drop\"><div class=\"dz\">⤓  drag DJI_0432.MP4 here<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"step\">\n        <span class=\"n\">STEP 02<\u002Fspan>\n        <h3>Drop a folder of LUTs.<\u002Fh3>\n        <p>Point LutStudio at <span style=\"font-family:var(--mono); color:var(--fg)\">/LUTs<\u002Fspan> and the whole pack loads. Arrow-key through forty of them on top of your footage. Star the keepers. Bin the rest.<\u002Fp>\n        <div class=\"demo list\">\n          <div class=\"row\"><span><span class=\"sw\" style=\"background:linear-gradient(135deg, oklch(0.78 0.14 55), oklch(0.38 0.06 30))\"><\u002Fspan>Kodak_2383_v2.cube<\u002Fspan><span>★<\u002Fspan><\u002Fdiv>\n          <div class=\"row sel\"><span><span class=\"sw\" style=\"background:linear-gradient(135deg, oklch(0.72 0.10 200), oklch(0.32 0.05 250))\"><\u002Fspan>Teal_Shadow_v4.cube<\u002Fspan><span>★<\u002Fspan><\u002Fdiv>\n          <div class=\"row\"><span><span class=\"sw\" style=\"background:linear-gradient(135deg, oklch(0.82 0.08 100), oklch(0.45 0.04 95))\"><\u002Fspan>NeutralStart_M31.cube<\u002Fspan><span><\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"step\">\n        <span class=\"n\">STEP 03<\u002Fspan>\n        <h3>Find the one in under a minute.<\u002Fh3>\n        <p>The graded frame paints in the same tick you let go of the file. Pull the split slider to A/B against log. Dial intensity from 0 to 100. Export the name of the winner.<\u002Fp>\n        <div class=\"demo preview\">\n          <div class=\"pane\" style=\"background:linear-gradient(135deg, oklch(0.56 0.012 110), oklch(0.42 0.010 90))\"><\u002Fdiv>\n          <div class=\"pane\" style=\"background:linear-gradient(135deg, oklch(0.78 0.14 55), oklch(0.30 0.04 30))\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FEATURES -->\n<section id=\"features\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <h2>A studio for your LUTs. <em>Nothing&nbsp;more.<\u002Fem><\u002Fh2>\n      <p class=\"blurb\">Just the tools you reach for when you're auditioning a look — none of the timeline, node-graph, project-file ceremony.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"features\">\n      <div class=\"feat span-6\">\n        <span class=\"tag\">INTENSITY<\u002Fspan>\n        <h3>Dial any LUT from 0 to 100.<\u002Fh3>\n        <p>Pack creators love to over-bake. Pull a hot Kodak emulation back to 60%; push a subtle teal pack to 130% to actually see it. One slider, live preview.<\u002Fp>\n        <div class=\"viz slider-viz\">\n          <span class=\"val\">0<\u002Fspan>\n          <div class=\"track\"><\u002Fdiv>\n          <span class=\"val\" style=\"color:var(--amber)\">72%<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"feat span-6\">\n        <span class=\"tag\">A/B<\u002Fspan>\n        <h3>Split view, draggable, full bleed.<\u002Fh3>\n        <p>The cliché works. Drag the divider to anywhere on the frame and watch shadows roll into teal in real time. Hold shift to wipe horizontally.<\u002Fp>\n        <div class=\"viz split\"><div class=\"a\"><\u002Fdiv><div class=\"div\"><\u002Fdiv><div class=\"b\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"feat span-4\">\n        <span class=\"tag\">FRAME PULL<\u002Fspan>\n        <h3>Extract any still.<\u002Fh3>\n        <p>Scrub to a frame, hit <span style=\"font-family:var(--mono);color:var(--fg)\">F<\u002Fspan>, and grade it as a still — no playback overhead. Perfect for skin-tone checks at 4K.<\u002Fp>\n        <div class=\"viz frame-viz\">\n          <div class=\"f\" style=\"background:linear-gradient(135deg, oklch(0.50 0.04 110), oklch(0.32 0.03 90))\"><\u002Fdiv>\n          <div class=\"f sel\" style=\"background:linear-gradient(135deg, oklch(0.78 0.14 55), oklch(0.30 0.04 30))\"><\u002Fdiv>\n          <div class=\"f\" style=\"background:linear-gradient(135deg, oklch(0.66 0.10 200), oklch(0.34 0.05 240))\"><\u002Fdiv>\n          <div class=\"f\" style=\"background:linear-gradient(135deg, oklch(0.74 0.08 90), oklch(0.40 0.04 80))\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"feat span-4\">\n        <span class=\"tag\">SCOPES<\u002Fspan>\n        <h3>Waveform + vectorscope.<\u002Fh3>\n        <p>Toggle a vectorscope to keep skin on the line. Waveform under the timeline tells you when you've clipped the highlights you spent the morning protecting.<\u002Fp>\n        <div class=\"viz scopes\">\n          <div class=\"col\">\n            <div class=\"bar\" style=\"background:var(--amber); width:30%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--amber); width:55%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--amber); width:80%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--amber); width:62%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--amber); width:40%\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"col\">\n            <div class=\"bar\" style=\"background:var(--teal); width:50%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--teal); width:72%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--teal); width:90%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--teal); width:65%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--teal); width:48%\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"col\">\n            <div class=\"bar\" style=\"background:var(--fg-mute); width:24%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--fg-mute); width:60%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--fg-mute); width:78%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--fg-mute); width:54%\"><\u002Fdiv>\n            <div class=\"bar\" style=\"background:var(--fg-mute); width:36%\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"feat span-4\">\n        <span class=\"tag\">.CUBE NATIVE<\u002Fspan>\n        <h3>Reads any 1D or 3D .cube.<\u002Fh3>\n        <p>17, 33, 65 — whatever size your pack ships in. Drop a folder and LutStudio parses the matrix right in the tab. No upload, no conversion, no \"preparing assets…\".<\u002Fp>\n        <div class=\"viz cube\"><div class=\"cubebox\"><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"feat span-8\">\n        <span class=\"tag\">CLIENT REVIEW · COMING IN PHASE&nbsp;3<\u002Fspan>\n        <h3>Send three LUTs. Get one \"approved\".<\u002Fh3>\n        <p>Pick the three looks worth showing. LutStudio compresses a 720p proxy in the browser and mints a private review URL. Your client clicks, picks, leaves a note — and you ship the right one the first time. No accounts, no logins, no 4&nbsp;GB transfers.<\u002Fp>\n        <div class=\"viz share\">\n          <span style=\"color:var(--fg-dim)\">https://<\u002Fspan>\n          <div class=\"url\">lutstudio.com/review/<span style=\"color:var(--amber)\">k3p7-honey-light-09<\u002Fspan><\u002Fdiv>\n          <button class=\"copy\">Copy<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"feat span-4\">\n        <span class=\"tag\">PRIVACY<\u002Fspan>\n        <h3>Footage never leaves your laptop.<\u002Fh3>\n        <p>Local-only by default — the clip is a browser object URL on your disk, the LUT is parsed in JS, the render runs on your GPU. LutStudio literally cannot see your work.<\u002Fp>\n        <div class=\"viz\" style=\"display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; color:var(--fg-mute);\">\n          <span style=\"opacity:.5;\">client<\u002Fspan>\n          <span style=\"margin:0 10px; color:var(--amber)\">●━━━━●<\u002Fspan>\n          <span style=\"opacity:.5;\">GPU<\u002Fspan>\n          <span style=\"margin:0 10px; color:var(--fg-dim)\">╳━━━━╳<\u002Fspan>\n          <span style=\"opacity:.5; text-decoration:line-through;\">server<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- AUDIENCE -->\n<section id=\"audience\">\n  <div class=\"wrap\">\n    <div class=\"section-head\">\n      <h2>Built for the people who shoot it&nbsp;<em>and<\u002Fem>&nbsp;cut it.<\u002Fh2>\n      <p class=\"blurb\">If your edit room is a 14\" laptop on a coffee-shop table and your LUT folder has more files than your camera roll, LutStudio was built for you.<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"audience\">\n      <div class=\"aud\">\n        <span class=\"role\">Weekend videographer<\u002Fspan>\n        <h3>You shot 90 GB of D-Log on Sunday. You'd like to know if it was worth it.<\u002Fh3>\n        <p>Drop the card into a tab and finally use the LUT pack you bought six months ago. Find out in ten minutes whether the day is worth a full edit.<\u002Fp>\n        <ul>\n          <li>Triage a card in under five minutes<\u002Fli>\n          <li>Audition the pack you forgot you bought<\u002Fli>\n          <li>Decide what's worth a real edit<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"aud\">\n        <span class=\"role\">Freelance editor<\u002Fspan>\n        <h3>The brief says \"cinematic.\" It always says cinematic. You have until Friday.<\u002Fh3>\n        <p>Show the client three LUT directions before you build a single node tree. Get a yes on Tuesday and bill the rest of the week for actually cutting.<\u002Fp>\n        <ul>\n          <li>Send a review link, not a 4&nbsp;GB transfer<\u002Fli>\n          <li>Lock the look before you lock the cut<\u002Fli>\n          <li>Kill three rounds of revisions<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <div class=\"aud\">\n        <span class=\"role\">Wedding &amp; event shooter<\u002Fspan>\n        <h3>Forty cards, one weekend, one chance to make the highlight reel sing.<\u002Fh3>\n        <p>Audition every emulation across an entire ceremony in the time it used to take to make proxies. Find the LUT that flatters the dress and stop second-guessing.<\u002Fp>\n        <ul>\n          <li>Batch-preview a folder of clips<\u002Fli>\n          <li>Pin a hero frame for skin-tone checks<\u002Fli>\n          <li>Export only the LUT you actually used<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FAQ -->\n<section id=\"faq\">\n  <div class=\"wrap\">\n    <div class=\"faq\">\n      <div>\n        <h2>Questions, <em>asked<\u002Fem>.<\u002Fh2>\n        <p style=\"margin-top:18px; color:var(--fg-mute); font-size:15px; max-width:30ch;\">Anything we missed? Reply to your waitlist confirmation — a real human reads it.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <details open=\"\">\n          <summary>Will my 4K footage actually play back in a browser?<span class=\"plus\"><\u002Fspan><\u002Fsummary>\n          <p>If your laptop can play it in QuickTime, it can play it here. We hand the decode to your browser's native video element and only touch the texture on the GPU side, so playback cost is essentially the same as watching the file in Finder.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>Does it support .cube files from my favorite pack?<span class=\"plus\"><\u002Fspan><\u002Fsummary>\n          <p>Yes — anything that conforms to the Adobe/IRIDAS .cube spec, 1D or 3D, sizes from 17 to 65. If you have a weird one LutStudio chokes on, send it over during beta and we'll add a parser test.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>What about Resolve's .drx or Apple's .dctl?<span class=\"plus\"><\u002Fspan><\u002Fsummary>\n          <p>Not on day one. Phase 1 is .cube only — it's the format 90% of pack creators ship in. .drx and .dctl involve node graphs and Metal-only shaders we'd have to re-implement. On the roadmap, not the MVP.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>Is my footage uploaded anywhere?<span class=\"plus\"><\u002Fspan><\u002Fsummary>\n          <p>No. During Phase 1, nothing leaves your machine — the video is a local <span style=\"font-family:var(--mono); color:var(--fg)\">object URL<\u002Fspan>, the LUT is parsed in JS, the render runs on your GPU. When the Phase 3 review-link feature ships, you'll opt in per project and only a 720p proxy is uploaded.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>What does it cost?<span class=\"plus\"><\u002Fspan><\u002Fsummary>\n          <p>Free during beta. After that, the local LUT studio stays free forever — drop, preview, audition, export, all gratis. We'll charge a small monthly fee (think one coffee) for the Phase 3 client-review links, when they ship.<\u002Fp>\n        <\u002Fdetails>\n        <details>\n          <summary>What hardware do I need?<span class=\"plus\"><\u002Fspan><\u002Fsummary>\n          <p>Any laptop made after 2019 with a half-decent GPU. We've tested on M-series MacBook Airs, mid-range Windows laptops with integrated graphics, and a 2020 Razer. If your machine renders YouTube at 4K, you're fine.<\u002Fp>\n        <\u002Fdetails>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FINAL CTA -->\n<section class=\"final\" id=\"waitlist\">\n  <div class=\"wrap\">\n    <h2>Stop importing. Start <em>auditioning<\u002Fem>.<\u002Fh2>\n    <p>2,400+ shooters, editors, and colorists are already in line for LutStudio. Add your email — we open seats every Friday.<\u002Fp>\n\n    <form class=\"waitlist\" id=\"waitlist-2\" novalidate=\"\">\n      <div class=\"field\">\n        <input type=\"email\" placeholder=\"your@email.com\" required=\"\" aria-label=\"Email\">\n        <button class=\"submit\" type=\"submit\">Join the waitlist<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"micro\" style=\"justify-content:center;\">\n        <span class=\"ok\">\n          <svg class=\"ok-check\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2 6.5L5 9L10 3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          Free during beta\n        <\u002Fspan>\n        <span class=\"ok\">\n          <svg class=\"ok-check\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2 6.5L5 9L10 3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          Local-only by default\n        <\u002Fspan>\n        <span class=\"ok\">\n          <svg class=\"ok-check\" viewBox=\"0 0 12 12\" fill=\"none\"><path d=\"M2 6.5L5 9L10 3\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n          One email a month, max\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"done\">\n        Welcome in. We'll email you when your seat opens — usually inside a week.<br>\n        <span style=\"color:var(--fg-dim); font-size:12.5px; font-family:var(--mono); margin-top:6px; display:inline-block;\">queue position #<span class=\"qpos\">2,431<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fform>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n  <div class=\"wrap row\">\n    <div class=\"meta\">© 2026 LutStudio.com · A zero-compute LUT previewer<\u002Fdiv>\n    <div class=\"links\">\n      <a href=\"#how\">How it works<\u002Fa>\n      <a href=\"#features\">Features<\u002Fa>\n      <a href=\"#faq\">FAQ<\u002Fa>\n      <a href=\"#waitlist\">Waitlist<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n  // Splitter drag — works on hero before/after viewer\n  (function(){\n    const viewer = document.getElementById('viewer');\n    const after  = document.getElementById('afterLayer');\n    const split  = document.getElementById('splitter');\n    if (!viewer) return;\n\n    let dragging = false;\n    function setPct(pct){\n      pct = Math.max(2, Math.min(98, pct));\n      viewer.style.setProperty('--split', pct + '%');\n    }\n    function handlePointer(e){\n      if (!dragging) return;\n      const rect = viewer.getBoundingClientRect();\n      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;\n      setPct((x / rect.width) * 100);\n    }\n    function start(e){ dragging = true; handlePointer(e); e.preventDefault?.(); }\n    function end(){ dragging = false; }\n\n    split.addEventListener('pointerdown', start);\n    viewer.addEventListener('pointerdown', start);\n    window.addEventListener('pointermove', handlePointer);\n    window.addEventListener('pointerup', end);\n    window.addEventListener('pointercancel', end);\n\n    // gentle idle wiggle so people see it's draggable\n    let t = 0, raf;\n    function idle(){\n      if (dragging) return;\n      t += 0.012;\n      const pct = 50 + Math.sin(t) * 8;\n      setPct(pct);\n      raf = requestAnimationFrame(idle);\n    }\n    raf = requestAnimationFrame(idle);\n    viewer.addEventListener('pointerenter', ()=>{ cancelAnimationFrame(raf); });\n  })();\n\n  /* ───────── TWEAKS PANEL ───────── */\n  (function(){\n    const TWEAKS = /*EDITMODE-BEGIN*/{\n      \"titleFont\": \"DM Serif Display\",\n      \"italicAccent\": true\n    }/*EDITMODE-END*/;\n\n    const FONT_OPTIONS = [\n      { key: \"Instrument Serif\",  stack: '\"Instrument Serif\", \"Times New Roman\", serif',  weight: 400, label: \"Instrument\", note: \"Editorial italic · default\" },\n      { key: \"Newsreader\",        stack: '\"Newsreader\", Georgia, serif',                  weight: 400, label: \"Newsreader\",  note: \"Warm magazine serif\" },\n      { key: \"Bricolage Grotesque\", stack: '\"Bricolage Grotesque\", ui-sans-serif, sans-serif', weight: 500, label: \"Bricolage\", note: \"Modern display grotesk\" },\n      { key: \"DM Serif Display\",  stack: '\"DM Serif Display\", \"Didot\", serif',            weight: 400, label: \"DM Serif\",   note: \"High-contrast classical\" }\n    ];\n\n    const root = document.documentElement;\n\n    function apply(t){\n      const opt = FONT_OPTIONS.find(o => o.key === t.titleFont) || FONT_OPTIONS[0];\n      root.style.setProperty('--serif', opt.stack);\n      root.style.setProperty('--serif-weight', String(opt.weight));\n      // toggle italic accent on display <em>\n      document.querySelectorAll('h1.display em, .section-head h2 em, .faq h2 em, .final h2 em').forEach(el => {\n        el.style.fontStyle = t.italicAccent ? 'italic' : 'normal';\n      });\n    }\n    // re-apply weight onto all serif display elements\n    const weightStyle = document.createElement('style');\n    weightStyle.textContent = `\n      h1.display, .section-head h2, .step h3, .feat h3, .aud h3, .pain h3, .faq h2, .final h2, details summary {\n        font-weight: var(--serif-weight, 400);\n      }\n      details summary { font-weight: 400; } /* keep summaries normal */\n      .step h3, .feat h3, .aud h3, .pain h3 { font-weight: var(--serif-weight, 400); }\n    `;\n    document.head.appendChild(weightStyle);\n\n    apply(TWEAKS);\n\n    /* Build the panel */\n    const panel = document.createElement('div');\n    panel.id = 'tweaks-panel';\n    panel.innerHTML = `\n      <div class=\"tw-head\">\n        <div class=\"tw-title\">Tweaks<\u002Fdiv>\n        <button class=\"tw-close\" aria-label=\"Close\">×<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"tw-section\">\n        <div class=\"tw-label\">Title typeface<\u002Fdiv>\n        <div class=\"tw-fonts\">\n          ${FONT_OPTIONS.map(o => `\n            <button class=\"tw-font\" data-key=\"${o.key}\" style=\"font-family:${o.stack}; font-weight:${o.weight};\">\n              <span class=\"tw-font-sample\">Audition <em>every<\u002Fem><\u002Fspan>\n              <span class=\"tw-font-meta\">${o.label} · ${o.note}<\u002Fspan>\n            <\u002Fbutton>\n          `).join('')}\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"tw-section\">\n        <div class=\"tw-row\">\n          <label class=\"tw-toggle\">\n            <input type=\"checkbox\" id=\"tw-italic\" />\n            <span class=\"tw-track\"><span class=\"tw-thumb\"><\u002Fspan><\u002Fspan>\n            <span class=\"tw-toggle-label\">Italicize accent words<\u002Fspan>\n          <\u002Flabel>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `;\n\n    const css = document.createElement('style');\n    css.textContent = `\n      #tweaks-panel{\n        position:fixed; right:20px; bottom:20px; width:300px;\n        z-index:1000; display:none;\n        background:var(--bg-2); color:var(--fg);\n        border:1px solid var(--line-2); border-radius:14px;\n        box-shadow: 0 30px 80px -30px oklch(0 0 0 / 0.7);\n        font-family:var(--sans);\n        overflow:hidden;\n      }\n      #tweaks-panel.is-open{display:block;}\n      #tweaks-panel .tw-head{\n        display:flex; align-items:center; justify-content:space-between;\n        padding:14px 16px; border-bottom:1px solid var(--line);\n        background:var(--bg-3);\n      }\n      #tweaks-panel .tw-title{\n        font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-mute);\n      }\n      #tweaks-panel .tw-close{\n        width:24px; height:24px; border-radius:6px; color:var(--fg-mute);\n        font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center;\n      }\n      #tweaks-panel .tw-close:hover{background:var(--bg); color:var(--fg);}\n      #tweaks-panel .tw-section{padding:14px 16px; border-bottom:1px solid var(--line);}\n      #tweaks-panel .tw-section:last-child{border-bottom:0;}\n      #tweaks-panel .tw-label{\n        font-family:var(--mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--fg-dim);\n        margin-bottom:10px;\n      }\n      #tweaks-panel .tw-fonts{display:flex; flex-direction:column; gap:6px;}\n      #tweaks-panel .tw-font{\n        text-align:left; padding:10px 12px; border-radius:8px;\n        border:1px solid var(--line); background:var(--bg);\n        display:flex; flex-direction:column; gap:2px;\n        cursor:pointer; transition: border-color .12s, background .12s;\n      }\n      #tweaks-panel .tw-font:hover{border-color:var(--line-2);}\n      #tweaks-panel .tw-font.active{border-color:var(--amber); background:color-mix(in oklch, var(--amber) 8%, var(--bg));}\n      #tweaks-panel .tw-font-sample{font-size:22px; line-height:1.1; letter-spacing:-0.01em; color:var(--fg);}\n      #tweaks-panel .tw-font-sample em{color:var(--amber);}\n      #tweaks-panel .tw-font-meta{font-family:var(--mono); font-size:10px; color:var(--fg-dim); letter-spacing:.04em;}\n      #tweaks-panel .tw-row{display:flex; align-items:center;}\n      #tweaks-panel .tw-toggle{display:flex; align-items:center; gap:10px; cursor:pointer; font-size:13px; color:var(--fg-mute);}\n      #tweaks-panel .tw-toggle input{position:absolute; opacity:0; pointer-events:none;}\n      #tweaks-panel .tw-track{\n        width:30px; height:18px; border-radius:999px; background:var(--bg-3); position:relative; transition:background .15s;\n        border:1px solid var(--line-2);\n      }\n      #tweaks-panel .tw-thumb{\n        position:absolute; top:2px; left:2px; width:12px; height:12px; border-radius:50%;\n        background:var(--fg-mute); transition:transform .15s, background .15s;\n      }\n      #tweaks-panel .tw-toggle input:checked + .tw-track{background:var(--amber);}\n      #tweaks-panel .tw-toggle input:checked + .tw-track .tw-thumb{transform:translateX(12px); background:#1a1410;}\n    `;\n    document.head.appendChild(css);\n    document.body.appendChild(panel);\n\n    /* State */\n    let state = { ...TWEAKS };\n    function syncUI(){\n      panel.querySelectorAll('.tw-font').forEach(btn => {\n        btn.classList.toggle('active', btn.dataset.key === state.titleFont);\n      });\n      panel.querySelector('#tw-italic').checked = !!state.italicAccent;\n    }\n    function setKeys(partial){\n      state = { ...state, ...partial };\n      apply(state);\n      syncUI();\n      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: partial }, '*');\n    }\n\n    panel.querySelectorAll('.tw-font').forEach(btn => {\n      btn.addEventListener('click', () => setKeys({ titleFont: btn.dataset.key }));\n    });\n    panel.querySelector('#tw-italic').addEventListener('change', e => {\n      setKeys({ italicAccent: e.target.checked });\n    });\n    panel.querySelector('.tw-close').addEventListener('click', () => {\n      panel.classList.remove('is-open');\n      window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');\n    });\n\n    /* Protocol: register listener BEFORE announcing */\n    window.addEventListener('message', (e) => {\n      const t = e.data?.type;\n      if (t === '__activate_edit_mode')   { panel.classList.add('is-open'); syncUI(); }\n      if (t === '__deactivate_edit_mode') { panel.classList.remove('is-open'); }\n    });\n    window.parent.postMessage({ type: '__edit_mode_available' }, '*');\n\n    syncUI();\n  })();\n\n  // Waitlist form: fake success state + decrement queue number for theatre\n  (function(){\n    function wire(form){\n      if (!form) return;\n      form.addEventListener('submit', e=>{\n        e.preventDefault();\n        const input = form.querySelector('input[type=\"email\"]');\n        if (!input.value || !input.value.includes('@')) {\n          input.focus();\n          return;\n        }\n        form.classList.add('is-done');\n        const q = 2400 + Math.floor(Math.random()*60);\n        form.querySelectorAll('.qpos, #qpos').forEach(el => el.textContent = q.toLocaleString());\n      });\n    }\n    wire(document.getElementById('waitlist-1'));\n    wire(document.getElementById('waitlist-2'));\n  })();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
